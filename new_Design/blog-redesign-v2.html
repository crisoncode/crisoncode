function BootScreen({onDone}){
  const [lines, setLines] = useState([]);
  const doneRef = useRef(false);
  useEffect(()=>{
    const timers = BOOT_LINES.map(({t,text,color,blink})=>
      setTimeout(()=>setLines(l=>[...l,{text,color,blink}]),t)
    );
    const autoTimer = setTimeout(()=>{ if(!doneRef.current){ doneRef.current=true; onDone(); }}, 2600);
    return ()=>{ timers.forEach(clearTimeout); clearTimeout(autoTimer); };
  },[]);
  const handleKey = useCallback(()=>{ if(!doneRef.current){ doneRef.current=true; onDone(); }},[]);
  useEffect(()=>{
    window.addEventListener('keydown',handleKey);
    window.addEventListener('click',handleKey);
    return()=>{ window.removeEventListener('keydown',handleKey); window.removeEventListener('click',handleKey); };
  },[]);
  return(
    <div style={{fontFamily:'var(--font)',fontSize:13,lineHeight:1.6,cursor:'default'}}>
      {lines.map((l,i)=>(
        <div key={i} style={{color:l.color||'#33ff33',animation:l.blink?'blink 1s infinite':undefined}}>
          {l.text||'\u00a0'}
        </div>
      ))}
    </div>
  );
}

// ── Typewriter ────────────────────────────────────────────────────────
function TypeWriter({lines, speed=30, onDone}){
  const [displayed,setDisplayed]=useState([]);
  const [lineIdx,setLineIdx]=useState(0);
  const [charIdx,setCharIdx]=useState(0);
  const [finished,setFinished]=useState(false);
  useEffect(()=>{
    if(lineIdx>=lines.length){setFinished(true);onDone&&onDone();return;}
    const line=lines[lineIdx];
    if(charIdx<=line.length){
      const t=setTimeout(()=>{
        setDisplayed(prev=>{const n=[...prev];n[lineIdx]=line.slice(0,charIdx);return n;});
        setCharIdx(c=>c+1);
      },charIdx===0?150:speed);
      return()=>clearTimeout(t);
    } else {
      const t=setTimeout(()=>{setLineIdx(l=>l+1);setCharIdx(0);},50);
      return()=>clearTimeout(t);
    }
  },[lineIdx,charIdx,lines,speed]);

  return(
    <div>
      {lines.map((line,i)=>{
        const txt=displayed[i]??'';
        const isCurrent=i===lineIdx;
        if(i>lineIdx)return null;
        if(line==='')return<div key={i} style={{height:'1.4em'}}/>;
        const isPrompt=line.startsWith('$');
        const isComment=line.startsWith('//')||line.startsWith('#');
        const isOut=!isPrompt&&!isComment;
        return(
          <div key={i} style={{color:isComment?'var(--text-dim)':isPrompt?'var(--accent)':'var(--text)',minHeight:'1.5em',fontFamily:'var(--font)',fontSize:13,lineHeight:1.7}}>
            {txt}{isCurrent&&!finished&&<span style={{animation:'blink 1s infinite',color:'var(--accent)'}}>▋</span>}
          </div>
        );
      })}
      {finished&&<span style={{animation:'blink 1s infinite',color:'var(--accent)'}}>▋</span>}
    </div>
  );
}

function CommandPalette({onCmd,onClose,setPage,setDark}){
  const [val,setVal]=useState('');
  const [sel,setSel]=useState(0);

    if(cmd==='dark'){ setDark(d=>!d); onClose(); return; }
    if(cmd==='search'){ setPage('posts'); onClose(); return; }
    setPage(cmd==='home'?'home':cmd); onClose();
  };

  return(
    <div className="cmd-overlay" onClick={onClose}>

            onKeyDown={e=>{
              if(e.key==='Escape')onClose();
              if(e.key==='ArrowDown'){setSel(s=>Math.min(s+1,items.length-1));}
              if(e.key==='ArrowUp'){setSel(s=>Math.max(s-1,0));}
              if(e.key==='Enter'&&items[sel]){execute(items[sel].cmd);}
            }}
            placeholder="type a command..."
            style={{flex:1,background:'none',border:'none',outline:'none',fontFamily:'var(--font)',fontSize:14,color:'var(--text-bright)',padding:'12px 0'}}
          />
          <span style={{fontSize:11,color:'var(--text-dim)'}}>esc</span>
        </div>
        <div style={{maxHeight:260,overflowY:'auto'}}>
          {items.map((o,i)=>(
            <div key={o.cmd} onClick={()=>execute(o.cmd)}
              style={{display:'flex',alignItems:'center',padding:'10px 14px',cursor:'pointer',
                background:i===sel?'var(--accent-dim)':'transparent',
                borderLeft:i===sel?'2px solid var(--accent)':'2px solid transparent',
                transition:'all 0.1s'}}
              onMouseEnter={()=>setSel(i)}>
              <span style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)',width:24}}>{o.key}</span>
              <span style={{fontFamily:'var(--font)',fontSize:13,color:i===sel?'var(--accent)':'var(--text-bright)',flex:1}}>{o.cmd}</span>
              <span style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)'}}>{o.desc}</span>
            </div>
          ))}
        </div>
        <div style={{padding:'8px 14px',borderTop:'1px solid var(--border)',display:'flex',gap:16}}>
          <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)'}}>↑↓ navigate</span>
          <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)'}}>↵ select</span>
          <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)'}}>esc close</span>
          <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)',marginLeft:'auto'}}>press <span style={{color:'var(--accent)'}}>:</span> anytime to open</span>
        </div>
      </div>
    </div>
  );
}

// ── Post Page ─────────────────────────────────────────────────────────
function PostPage({post,setPage,setCurrentPost}){
  const [progress,setProgress]=useState(0);
  const bodyRef=useRef();
  useEffect(()=>{
    window.scrollTo(0,0);
    const onScroll=()=>{
      const el=bodyRef.current; if(!el)return;
      const top=el.getBoundingClientRect().top;
      const h=el.offsetHeight;
      setProgress(Math.min(100,Math.max(0,(-top/(h-window.innerHeight))*100)));
    };
    window.addEventListener('scroll',onScroll);
    return()=>window.removeEventListener('scroll',onScroll);
  },[post]);

  function renderInline(text){
    // bold + code
    const result=[];
    let remaining=text;
    const re=/(\*\*(.+?)\*\*|`(.+?)`)/g;
    let last=0; let m;
    while((m=re.exec(text))!==null){
      if(m.index>last)result.push(text.slice(last,m.index));
      if(m[0].startsWith('**'))result.push(<strong key={m.index} style={{color:'var(--text-bright)',fontWeight:600}}>{m[2]}</strong>);
      else result.push(<code key={m.index} style={{fontFamily:'var(--font)',fontSize:11,background:'var(--accent-dim)',border:'1px solid rgba(55,195,220,0.2)',borderRadius:3,padding:'1px 5px',color:'var(--accent)'}}>{m[3]}</code>);
      last=m.index+m[0].length;
    }
    result.push(text.slice(last));
    return result;
  }

  function renderBody(text){
    const lines=text.split('\n');
    const els=[]; let i=0;
    while(i<lines.length){
      const line=lines[i];
      if(line.startsWith('## ')){
        els.push(<h2 key={i} style={{fontFamily:'var(--font)',fontSize:15,fontWeight:600,color:'var(--accent)',marginTop:36,marginBottom:10,letterSpacing:'-0.01em',display:'flex',alignItems:'center',gap:10}}>
          <span style={{color:'var(--border2)'}}>##</span>{line.slice(3)}
        </h2>);
      } else if(line.startsWith('### ')){
        els.push(<h3 key={i} style={{fontFamily:'var(--font)',fontSize:13,fontWeight:600,color:'var(--amber)',marginTop:24,marginBottom:8}}>
          <span style={{color:'var(--border2)'}}>### </span>{line.slice(4)}
        </h3>);
      } else if(line.startsWith('> ')){
        els.push(<blockquote key={i} style={{borderLeft:'2px solid var(--amber)',padding:'10px 14px',margin:'14px 0',background:'var(--amber-dim)',borderRadius:'0 3px 3px 0',fontStyle:'italic',fontFamily:'var(--font)',fontSize:13,color:'var(--text)',lineHeight:1.7}}>{line.slice(2)}</blockquote>);
      } else if(line.startsWith('```')){
        const lang=line.slice(3);
        const codeLines=[]; i++;
        while(i<lines.length&&!lines[i].startsWith('```')){codeLines.push(lines[i]);i++;}
        els.push(
          <div key={i} style={{margin:'14px 0',border:'1px solid var(--border)',borderRadius:4,overflow:'hidden'}}>
            {lang&&<div style={{background:'var(--bg4)',padding:'5px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)'}}>{lang}</span>
              <span style={{fontFamily:'var(--font)',fontSize:10,color:'var(--text-dim)',opacity:0.5}}>{codeLines.length} lines</span>
            </div>}
            <pre style={{background:'#070a0f',padding:'14px 16px',overflowX:'auto',margin:0}}>
              <code style={{fontFamily:'var(--font)',fontSize:12,color:'#a8c8e8',lineHeight:1.7}}>{codeLines.join('\n')}</code>
            </pre>
          </div>
        );
      } else if(line.startsWith('- ')||line.startsWith('* ')){
        const items=[];
        while(i<lines.length&&(lines[i].startsWith('- ')||lines[i].startsWith('* '))){items.push(lines[i].slice(2));i++;}
        els.push(<ul key={i} style={{margin:'10px 0',padding:0,listStyle:'none'}}>
          {items.map((item,j)=>(
            <li key={j} style={{fontFamily:'var(--font)',fontSize:13,color:'var(--text)',lineHeight:1.75,marginBottom:4,paddingLeft:20,position:'relative'}}>
              <span style={{position:'absolute',left:0,color:'var(--accent)'}}>›</span>
              {renderInline(item)}
            </li>
          ))}
        </ul>);
        continue;
      } else if(line.trim()===''){
        els.push(<div key={i} style={{height:6}}/>);
      } else {
        els.push(<p key={i} style={{fontFamily:'var(--font)',fontSize:13,color:'var(--text)',lineHeight:1.8,marginBottom:12}}>{renderInline(line)}</p>);
      }
      i++;
    }
    return els;
  }

  const idx=POSTS.findIndex(p=>p.slug===post.slug);
  const prev=POSTS[idx-1], next=POSTS[idx+1];

  return(
    <div style={{animation:'fadeUp 0.4s both'}}>
      <div style={{position:'fixed',top:48,left:0,height:2,width:`${progress}%`,background:'var(--accent)',zIndex:99,transition:'width 0.1s linear',boxShadow:'0 0 8px var(--accent)'}}/>
      <div style={{maxWidth:740,margin:'0 auto',padding:'32px 20px 80px'}}>
        {/* breadcrumb */}
        <div style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)',marginBottom:24,display:'flex',gap:6,alignItems:'center'}}>
          <button onClick={()=>setPage('posts')} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'var(--font)',fontSize:11,color:'var(--accent)',padding:0}}>posts/</button>
          <span>›</span><span>{post.title}</span>
        </div>
        {/* header */}
        <div style={{marginBottom:28,paddingBottom:20,borderBottom:'1px solid var(--border)'}}>
          <h1 style={{fontFamily:'var(--font)',fontSize:22,fontWeight:700,color:'var(--text-bright)',letterSpacing:'-0.03em',lineHeight:1.3,marginBottom:12}}>{post.displayTitle}</h1>
          <div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
            <span style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)'}}>{fmtDateShort(post.date)}</span>
            <span style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)'}}>~{post.readTime} min</span>
            <span style={{fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)'}}>{post.size}</span>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{post.tags.map(t=><Tag key={t} label={t}/>)}</div>
          </div>
        </div>
        {/* body */}
        <div ref={bodyRef}>{renderBody(post.body)}</div>
        {/* nav */}
        <div style={{marginTop:40,paddingTop:20,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          {[
            {post:prev,label:'←',dir:'prev'},
            {post:next,label:'→',dir:'next'},
          ].map(({post:p,label,dir})=>p?(
            <button key={dir} onClick={()=>{setCurrentPost(p);window.scrollTo(0,0);}}
              style={{background:'none',border:'1px solid var(--border)',borderRadius:3,cursor:'pointer',fontFamily:'var(--font)',fontSize:11,color:'var(--text-dim)',padding:'6px 12px',transition:'all 0.12s',textAlign:dir==='next'?'right':'left',flex:'0 1 300px'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--text-dim)';}}
            >
              <div style={{fontSize:10,marginBottom:2,opacity:0.6}}>{dir} {label}</div>
              {p.title}
            </button>
          ):<div key={dir}/>)}
        </div>
      </div>
    </div>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontSize": 13,
  "crtEffect": true,
  "dotGrid": true,
  "accentColor": "#37c3dc",
  "bootScreen": true
}/*EDITMODE-END*/;

function TweaksPanel({tweaks,setTweaks}){
  return(
    <div style={{position:'fixed',bottom:42,right:20,zIndex:300,background:'var(--bg3)',border:'1px solid var(--accent)',borderRadius:5,padding:14,width:220,fontFamily:'var(--font)',fontSize:12,boxShadow:'0 0 30px rgba(55,195,220,0.15)'}}>
      <div style={{color:'var(--accent)',fontWeight:700,marginBottom:12,fontSize:11,letterSpacing:'0.06em'}}>// TWEAKS</div>
      <label style={{display:'block',marginBottom:10}}>
        <div style={{color:'var(--text-dim)',marginBottom:3}}>font_size: {tweaks.fontSize}px</div>
        <input type="range" min={11} max={16} value={tweaks.fontSize} onChange={e=>{const v={...tweaks,fontSize:+e.target.value};setTweaks(v);window.parent.postMessage({type:'__edit_mode_set_keys',edits:v},'*');}} style={{width:'100%',accentColor:'var(--accent)'}}/>
      </label>
      {[
        {key:'crtEffect',label:'crt_scanlines'},
        {key:'dotGrid',label:'dot_grid'},
        {key:'bootScreen',label:'boot_sequence'},
      ].map(({key,label})=>(
        <label key={key} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,cursor:'pointer'}}>
          <input type="checkbox" checked={tweaks[key]} onChange={e=>{const v={...tweaks,[key]:e.target.checked};setTweaks(v);window.parent.postMessage({type:'__edit_mode_set_keys',edits:v},'*');}} style={{accentColor:'var(--accent)'}}/>
          <span style={{color:'var(--text-dim)'}}>{label}</span>
        </label>
      ))}
      <div style={{marginTop:8}}>
        <div style={{color:'var(--text-dim)',marginBottom:6,fontSize:11}}>accent_color</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['#37c3dc','#4ec994','#f5af4b','#e05c5c','#a78bfa','#ff6eb4'].map(c=>(
            <button key={c} onClick={()=>{const v={...tweaks,accentColor:c};setTweaks(v);document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-dim',c+'20');window.parent.postMessage({type:'__edit_mode_set_keys',edits:v},'*');}} style={{width:20,height:20,borderRadius:'50%',background:c,border:tweaks.accentColor===c?'2px solid white':'2px solid transparent',cursor:'pointer',boxShadow:tweaks.accentColor===c?`0 0 6px ${c}`:'none'}}/>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Theme hook ────────────────────────────────────────────────────────
function useTheme(){
  const [dark,setDark]=useState(()=>localStorage.getItem('theme')!=='light');
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    localStorage.setItem('theme',dark?'dark':'light');
  },[dark]);
  return [dark,setDark];
}

// ── App ───────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState(()=>localStorage.getItem('coc-page')||'home');
  const [currentPost,setCurrentPost]=useState(null);
  const [dark,setDark]=useTheme();
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const [showTweaks,setShowTweaks]=useState(false);
  const [showCmd,setShowCmd]=useState(false);
  const [booted,setBooted]=useState(()=>!!localStorage.getItem('coc-booted'));
  const [cmdMode,setCmdMode]=useState(false);

  useEffect(()=>{ localStorage.setItem('coc-page',page); },[page]);

  // CRT toggle
  useEffect(()=>{
    document.querySelectorAll('.crt').forEach(el=>{
      el.classList.toggle('crt',tweaks.crtEffect);
    });
    document.body.style.fontSize=tweaks.fontSize+'px';
    document.body.classList.toggle('no-grid',!tweaks.dotGrid);
  },[tweaks]);

  // Tweaks protocol
  useEffect(()=>{
    const h=(e)=>{
      if(e.data?.type==='__activate_edit_mode')setShowTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setShowTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  // Global keybindings
  useEffect(()=>{
    const h=(e)=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.key===':'||e.key==='/'){ e.preventDefault(); setShowCmd(true); setCmdMode(true); }
      if(e.key==='Escape'){ setShowCmd(false); setCmdMode(false); }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);

  const handleSetPage=(p)=>{ setPage(p); window.scrollTo(0,0); };
  const handleSetPost=(p)=>{ setCurrentPost(p); setPage('post'); window.scrollTo(0,0); };
  const handleBoot=()=>{ setBooted(true); localStorage.setItem('coc-booted','1'); };
  const handleCmd=()=>{ setShowCmd(true); setCmdMode(true); };
  const handleCloseCmd=()=>{ setShowCmd(false); setCmdMode(false); };

  // Boot screen
  useEffect(()=>{
    const bootEl=document.getElementById('boot');
    if(!bootEl)return;
    bootEl.classList.add('hidden');
  },[]);

  if(!booted&&tweaks.bootScreen){
    return(
      <div style={{position:'fixed',inset:0,background:'#000',zIndex:10000,display:'flex',flexDirection:'column',justifyContent:'flex-start',padding:32,fontFamily:'var(--font)',fontSize:13,color:'#33ff33',overflow:'hidden'}}>
        <BootScreen onDone={handleBoot}/>
      </div>
    );
  }

  return(
    <>
      <style>{`
        .no-grid::before{display:none!important}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        @keyframes glitch1{0%,94%,100%{clip-path:inset(0 0 100% 0);transform:translateX(0)}95%{clip-path:inset(15% 0 40% 0);transform:translateX(-4px)}96%{clip-path:inset(60% 0 5% 0);transform:translateX(4px)}97%{clip-path:inset(30% 0 50% 0);transform:translateX(-2px)}98%{clip-path:inset(0 0 100% 0);transform:translateX(0)}}
        @keyframes glitch2{0%,94%,100%{clip-path:inset(0 0 100% 0);transform:translateX(0)}95%{clip-path:inset(40% 0 20% 0);transform:translateX(3px);color:var(--red)}96%{clip-path:inset(5% 0 65% 0);transform:translateX(-3px);color:var(--purple)}97%{clip-path:inset(0 0 100% 0);transform:translateX(0)}}
        @keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
        @keyframes cmdFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
      `}</style>
      {showCmd&&<CommandPalette onCmd={()=>{}} onClose={handleCloseCmd} setPage={handleSetPage} setDark={setDark}/>}
      <Header page={page} setPage={handleSetPage} dark={dark} setDark={setDark} onCmd={handleCmd}/>
      <main style={{flex:1,paddingBottom:22}}>
        {page==='home'&&<HomePage setPage={handleSetPage} setCurrentPost={handleSetPost}/>}
        {page==='posts'&&<PostsPage setPage={handleSetPage} setCurrentPost={handleSetPost}/>}
        {page==='tags'&&<TagsPage setPage={handleSetPage} setCurrentPost={handleSetPost}/>}
        {page==='about'&&<AboutPage/>}
        {page==='post'&&currentPost&&<PostPage post={currentPost} setPage={handleSetPage} setCurrentPost={handleSetPost}/>}
      </main>
      <StatusBar page={page} postTitle={currentPost} cmdMode={cmdMode}/>
      {showTweaks&&<TweaksPanel tweaks={tweaks} setTweaks={setTweaks}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
