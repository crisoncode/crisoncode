    body: `Working remotely removes the ambient awareness you naturally get in an office — overhearing conversations, reading body language, catching someone by the coffee machine. You have to be **intentional** about everything that used to happen by accident.

## Over-communicate your state

Write it down. "Blocked on X, waiting for Y." "Deep focus until 3pm." "Stepping out, back in 30." Your team shouldn't have to wonder where you are or what you're doing. A quick async message saves three Slack pings.

## Async first, sync when necessary

The default should always be async. Write a clear, structured message that gives the reader everything they need to respond without back-and-forth. Reserve live calls for decisions that genuinely need real-time discussion — and set an agenda even then.

## Use video intentionally

Cameras on for 1:1s and team retros. Cameras off for long status meetings where you need to think. Don't force it either way, but be aware of what you lose when faces disappear from the screen.

## Structure your messages

**Subject**: what this is about.
**Context**: why it matters right now.
**Ask**: what you need, specifically.

Most communication problems come from unclear asks. Be explicit.

## Create rituals

Daily standups written in a shared doc. Weekly team coffee. End-of-week summary in Slack. Rituals create predictability, and predictability lowers anxiety in distributed teams.`

Everyone's talking about AI replacing developers. The reality is more nuanced. AI is replacing *certain tasks* within development, not developers themselves — at least not the ones who adapt. The developers who treat AI as a collaborator rather than a threat are shipping faster than ever.

    body: `Pair programming means writing all production code with two developers, one machine.

The idea sounds inefficient until you try it seriously. Then you realize you were measuring the wrong thing.

## Why we default to working alone

It's a habit. You learned to code alone, probably. Nobody sat next to you and explained why working with someone else might produce better outcomes. And solo coding has real pleasures — the deep flow state, the uninterrupted mental world you build around a problem.

The habit is hard to break. But it's worth breaking.

## What pair programming actually gives you

**Focus** — It's harder to get distracted when someone is watching. Not in a surveillance way. In a *we're both in this together* way.

**Better ideas** — Talking through a problem forces you to articulate it. The act of articulation often produces the solution.

**Knowledge sharing** — You can't hold knowledge hostage when you're coding together. It distributes naturally.

**Live code review** — Issues caught in the moment, not three days later in a PR comment.

## Patterns

**Driver / Navigator** — One writes, one observes and guides. Swap every 15–20 minutes.

**Ping Pong** — One writes the test, one writes the implementation. Rotate.

**Strong-style pairing** — The navigator controls direction entirely. Good for onboarding juniors.

## Common failure modes

- Navigator micromanaging keystroke-by-keystroke
- One person zoning out while the other types
- Not rotating often enough
- Forgetting to take breaks

## Your home is now your office

This is step one and most people skip it. Your home didn't become a home-office hybrid. It became your office, which happens to have your bed in it.

Designate a space. A desk, preferably a separate room. If you can't do a separate room, use visual/ritual cues to switch modes: a specific playlist, a specific lamp, a specific startup sequence.

## Change your mindset

Remote work rewards asynchronous communication and punishes the reflex to interrupt people. The instinct to Slack someone the moment a question occurs to you is the enemy. Write it down first. Can you answer it yourself? Can it wait two hours?

## Routine as infrastructure

Morning routine → work session → lunch (away from the screen) → afternoon session → explicit end-of-day ritual. This isn't rigid scheduling. It's installing the on/off switches that open-office environments provide for free.

## The energy problem

Commuting is bad, but it had a hidden benefit: it was a state transition. You need to design your own state transitions. A walk before work. A workout at lunch. Anything that marks the boundary.

## Tools matter less than you think

function useTheme() {
  const [dark, setDark] = useState(() => localStorage.getItem('theme') !== 'light');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    localStorage.setItem('theme', dark ? 'dark' : 'light');

// ── Typing animation ──────────────────────────────────────────────────
function TypeWriter({ lines, speed = 35 }) {
  const [displayed, setDisplayed] = useState([]);
  const [lineIdx, setLineIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (lineIdx >= lines.length) { setDone(true); return; }
    const line = lines[lineIdx];
    if (charIdx <= line.length) {
      const t = setTimeout(() => {
        setDisplayed(prev => {
          const next = [...prev];
          next[lineIdx] = line.slice(0, charIdx);
          return next;
        });
        setCharIdx(c => c + 1);
      }, charIdx === 0 ? 180 : speed);
      return () => clearTimeout(t);
    } else {
      const t = setTimeout(() => { setLineIdx(l => l + 1); setCharIdx(0); }, 60);
      return () => clearTimeout(t);
    }
  }, [lineIdx, charIdx, lines, speed]);

  return (
    <div style={{ fontFamily: 'var(--font)', fontSize: 14, lineHeight: 1.7 }}>
      {lines.map((line, i) => {
        const text = displayed[i] ?? '';
        const isCurrentLine = i === lineIdx;
        const isEmpty = line === '';
        if (isEmpty && i < lineIdx) return <div key={i} style={{ height: '1.2em' }} />;
        if (i > lineIdx) return null;
        const isPrompt = line.startsWith('$') || line.startsWith('>') || line.startsWith('#');
        const isComment = line.startsWith('//') || line.startsWith('#!');
        const isOutput = !isPrompt && !isComment && !isEmpty;
        return (
          <div key={i} style={{ color: isComment ? 'var(--text-dim)' : isPrompt ? 'var(--accent)' : isOutput ? 'var(--text)' : 'var(--text-dim)', minHeight: '1.5em' }}>
            {text}{isCurrentLine && !done && <span style={{ animation: 'blink 1s infinite', color: 'var(--accent)' }}>▋</span>}
          </div>
        );
      })}
      {done && <span style={{ animation: 'blink 1s infinite', color: 'var(--accent)' }}>▋</span>}
    </div>
  );
}

// ── Post Detail ───────────────────────────────────────────────────────
function PostPage({ post, setPage, setCurrentPost }) {
  const [progress, setProgress] = useState(0);
  const contentRef = useRef();

  useEffect(() => {
    window.scrollTo(0, 0);
    const onScroll = () => {
      const el = contentRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const total = el.offsetHeight;
      const scrolled = -rect.top;
      setProgress(Math.min(100, Math.max(0, (scrolled / (total - window.innerHeight)) * 100)));
    };
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, [post]);

  // Parse markdown-ish body
  function renderBody(text) {
    const lines = text.split('\n');
    const elements = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (line.startsWith('## ')) {
        elements.push(<h2 key={i} style={{ fontFamily: 'var(--font)', fontSize: 18, fontWeight: 600, color: 'var(--text-bright)', marginTop: 40, marginBottom: 12, letterSpacing: '-0.02em', borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>{line.slice(3)}</h2>);
      } else if (line.startsWith('### ')) {
        elements.push(<h3 key={i} style={{ fontFamily: 'var(--font)', fontSize: 15, fontWeight: 600, color: 'var(--accent)', marginTop: 28, marginBottom: 8, letterSpacing: '-0.01em' }}>{line.slice(4)}</h3>);
      } else if (line.startsWith('> ')) {
        elements.push(<blockquote key={i} style={{ fontFamily: 'var(--font)', fontSize: 14, fontStyle: 'italic', color: 'var(--text)', borderLeft: '3px solid var(--amber)', paddingLeft: 16, margin: '16px 0', background: 'var(--amber-dim)', padding: '12px 16px', borderRadius: '0 4px 4px 0' }}>{line.slice(2)}</blockquote>);
      } else if (line.startsWith('```')) {
        const lang = line.slice(3);
        const codeLines = [];
        i++;
        while (i < lines.length && !lines[i].startsWith('```')) {
          codeLines.push(lines[i]);
          i++;
        }
        elements.push(
          <pre key={i} style={{ background: '#0d1117', border: '1px solid var(--border)', borderRadius: 5, padding: '16px 18px', overflowX: 'auto', margin: '16px 0', fontSize: 12, lineHeight: 1.6 }}>
            {lang && <div style={{ fontFamily: 'var(--font)', fontSize: 10, color: 'var(--text-dim)', marginBottom: 8 }}>{lang}</div>}
            <code style={{ fontFamily: 'var(--font)', color: '#c9d1d9' }}>{codeLines.join('\n')}</code>
          </pre>
        );
      } else if (line.startsWith('- ') || line.startsWith('* ')) {
        const items = [];
        while (i < lines.length && (lines[i].startsWith('- ') || lines[i].startsWith('* '))) {
          items.push(lines[i].slice(2));
          i++;
        }
        elements.push(
          <ul key={i} style={{ margin: '12px 0 12px 0', paddingLeft: 0, listStyle: 'none' }}>
            {items.map((item, j) => (
              <li key={j} style={{ fontFamily: 'var(--font)', fontSize: 14, color: 'var(--text)', lineHeight: 1.7, marginBottom: 6, paddingLeft: 18, position: 'relative' }}>
                <span style={{ position: 'absolute', left: 0, color: 'var(--accent)' }}>›</span>
                {renderInline(item)}
              </li>
            ))}
          </ul>
        );
        continue;
      } else if (line.trim() === '') {
        elements.push(<div key={i} style={{ height: 8 }} />);
      } else {
        elements.push(<p key={i} style={{ fontFamily: 'var(--font)', fontSize: 14, color: 'var(--text)', lineHeight: 1.8, marginBottom: 14 }}>{renderInline(line)}</p>);
      }
      i++;
    }
    return elements;
  }

  function renderInline(text) {
    // Bold **...**
    const parts = [];
    const re = /\*\*(.+?)\*\*/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push(text.slice(last, m.index));
      parts.push(<strong key={m.index} style={{ color: 'var(--text-bright)', fontWeight: 600 }}>{m[1]}</strong>);
      last = m.index + m[0].length;
    }
    parts.push(text.slice(last));
    // Handle inline code `...`
    return parts.map((p, i) => {
      if (typeof p !== 'string') return p;
      const cparts = [];
      const cr = /`(.+?)`/g;
      let cl = 0, cm;
      while ((cm = cr.exec(p)) !== null) {
        if (cm.index > cl) cparts.push(p.slice(cl, cm.index));
        cparts.push(<code key={cm.index} style={{ fontFamily: 'var(--font)', fontSize: 12, background: 'var(--accent-dim)', border: '1px solid rgba(55,195,220,0.2)', borderRadius: 3, padding: '1px 5px', color: 'var(--accent)' }}>{cm[1]}</code>);
        cl = cm.index + cm[0].length;
      }
      cparts.push(p.slice(cl));
      return cparts;
    });
  }

  return (
    <div style={{ animation: 'fadeUp 0.4s both' }}>
      {/* Reading progress */}
      <div style={{ position: 'fixed', top: 52, left: 0, height: 2, width: `${progress}%`, background: 'var(--accent)', zIndex: 99, transition: 'width 0.1s linear' }} />

      <div style={{ maxWidth: 720, margin: '0 auto', padding: '40px 20px' }}>
        {/* Breadcrumb */}
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 28, fontFamily: 'var(--font)', fontSize: 11, color: 'var(--text-dim)' }}>
          <button onClick={() => setPage('posts')} style={{ background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'var(--font)', fontSize: 11, color: 'var(--accent)', padding: 0 }}>posts/</button>
          <span>›</span>
          <span>{post.slug}</span>
        </div>

        {/* Header */}
        <div style={{ marginBottom: 32, borderBottom: '1px solid var(--border)', paddingBottom: 24 }}>
          <h1 style={{ fontFamily: 'var(--font)', fontSize: 26, fontWeight: 700, color: 'var(--text-bright)', letterSpacing: '-0.03em', lineHeight: 1.3, marginBottom: 14 }}>
            {post.title}
          </h1>
          <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
            <span style={{ fontFamily: 'var(--font)', fontSize: 11, color: 'var(--text-dim)' }}>{formatDate(post.date)}</span>
            <span style={{ fontFamily: 'var(--font)', fontSize: 11, color: 'var(--text-dim)' }}>~{post.readTime} min read</span>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {post.tags.map(t => <Tag key={t} label={t} />)}
            </div>
          </div>
        </div>

        {/* Body */}
        <div ref={contentRef} id="article">
          {renderBody(post.body)}
        </div>

        {/* Footer */}
        <div style={{ marginTop: 48, paddingTop: 24, borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
          <button onClick={() => setPage('posts')} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 3, cursor: 'pointer', fontFamily: 'var(--font)', fontSize: 12, color: 'var(--text-dim)', padding: '6px 12px', transition: 'all 0.15s' }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.color = 'var(--accent)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-dim)'; }}
          >← all posts</button>

          {/* Next post */}
          {(() => {
            const idx = POSTS.findIndex(p => p.slug === post.slug);
            const next = POSTS[idx + 1];
            if (!next) return null;
            return (
              <button onClick={() => setCurrentPost(next)} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 3, cursor: 'pointer', fontFamily: 'var(--font)', fontSize: 12, color: 'var(--text-dim)', padding: '6px 12px', transition: 'all 0.15s', textAlign: 'right', maxWidth: 320 }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.color = 'var(--accent)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-dim)'; }}
              >
                <div style={{ fontSize: 10, marginBottom: 2, color: 'var(--text-dim)' }}>next →</div>
                {next.title}
              </button>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

  return (
    <footer style={{ borderTop: '1px solid var(--border)', marginTop: 'auto', padding: '20px', textAlign: 'center' }}>

// ── Tweaks Panel ──────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontSize": 14,
  "lineHeight": "1.8",
  "accentColor": "#37c3dc",
  "showGrid": true,
  "animationSpeed": "normal"
}/*EDITMODE-END*/;

function TweaksPanel({ tweaks, setTweaks }) {
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, zIndex: 200,
      background: 'var(--bg2)', border: '1px solid var(--accent)',
      borderRadius: 6, padding: 16, width: 230,
      fontFamily: 'var(--font)', fontSize: 12,
      boxShadow: '0 8px 32px rgba(0,0,0,0.4)',
    }}>
      <div style={{ color: 'var(--accent)', fontWeight: 600, marginBottom: 14, fontSize: 11, letterSpacing: '0.05em' }}>// TWEAKS</div>

      <label style={{ display: 'block', marginBottom: 12 }}>
        <div style={{ color: 'var(--text-dim)', marginBottom: 4 }}>font_size: {tweaks.fontSize}px</div>
        <input type="range" min={12} max={18} value={tweaks.fontSize} onChange={e => {
          const v = { ...tweaks, fontSize: +e.target.value };
          setTweaks(v);
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: v }, '*');
        }} style={{ width: '100%', accentColor: 'var(--accent)' }} />
      </label>

      <label style={{ display: 'block', marginBottom: 12 }}>
        <div style={{ color: 'var(--text-dim)', marginBottom: 4 }}>line_height: {tweaks.lineHeight}</div>
        <input type="range" min={1.4} max={2.2} step={0.1} value={tweaks.lineHeight} onChange={e => {
          const v = { ...tweaks, lineHeight: e.target.value };
          setTweaks(v);
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: v }, '*');
        }} style={{ width: '100%', accentColor: 'var(--accent)' }} />
      </label>

      <label style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, cursor: 'pointer' }}>
        <input type="checkbox" checked={tweaks.showGrid} onChange={e => {
          const v = { ...tweaks, showGrid: e.target.checked };
          setTweaks(v);
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: v }, '*');
        }} style={{ accentColor: 'var(--accent)' }} />
        <span style={{ color: 'var(--text-dim)' }}>dot_grid</span>
      </label>

      <label style={{ display: 'block' }}>
        <div style={{ color: 'var(--text-dim)', marginBottom: 6 }}>accent_color</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {['#37c3dc', '#4ec994', '#f5af4b', '#e05c5c', '#a78bfa'].map(c => (
            <button key={c} onClick={() => {
              const v = { ...tweaks, accentColor: c };
              setTweaks(v);
              document.documentElement.style.setProperty('--accent', c);
              document.documentElement.style.setProperty('--prompt', c);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: v }, '*');
            }} style={{ width: 22, height: 22, borderRadius: '50%', background: c, border: tweaks.accentColor === c ? '2px solid white' : '2px solid transparent', cursor: 'pointer' }} />
          ))}
        </div>
      </label>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState(() => localStorage.getItem('page') || 'home');
  const [currentPost, setCurrentPost] = useState(null);
  const [dark, setDark] = useTheme();
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => { localStorage.setItem('page', page); }, [page]);

  // Apply tweaks
  useEffect(() => {
    document.body.style.fontSize = tweaks.fontSize + 'px';
    document.body.style.setProperty('--line-height', tweaks.lineHeight);
    const grid = document.querySelector('body::before');
    // toggle grid via class
    document.body.classList.toggle('no-grid', !tweaks.showGrid);
  }, [tweaks]);

  // Tweaks toggle protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleSetPage = (p) => { setPage(p); window.scrollTo(0,0); };
  const handleSetPost = (post) => { setCurrentPost(post); setPage('post'); window.scrollTo(0,0); };

  return (
    <>
      <style>{`.no-grid::before { display: none !important; }`}</style>
      <Header page={page} setPage={handleSetPage} dark={dark} setDark={setDark} />
      <main style={{ flex: 1 }}>
        {page === 'home' && <HomePage setPage={handleSetPage} setCurrentPost={handleSetPost} />}
        {page === 'posts' && <PostsPage setPage={handleSetPage} setCurrentPost={handleSetPost} />}
        {page === 'tags' && <TagsPage setPage={handleSetPage} setCurrentPost={handleSetPost} />}
        {page === 'about' && <AboutPage />}
        {page === 'post' && currentPost && <PostPage post={currentPost} setPage={handleSetPage} setCurrentPost={handleSetPost} />}
      </main>
      <Footer />
      {showTweaks && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
